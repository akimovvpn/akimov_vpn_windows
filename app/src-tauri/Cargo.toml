[package]
name = "akimov-vpn"
version = "1.0.12"
edition = "2021"
description = "akimov vpn for Windows"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# signed in-app updates; Windows TLS, like the rest of the app
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
regex = "1"
sha2 = "0.10"
serde_yaml = "0.9"
# native-tls uses Windows' own TLS: no C toolchain, smaller binary, less memory than bundling a TLS stack
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Networking_WinInet",
  "Win32_System_JobObjects",
  "Win32_System_Services",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

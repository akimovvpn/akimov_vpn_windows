name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check release version
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and app version differ.' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
      - name: Build patched core from verified upstream source
        run: ./app/build-core.ps1
      - name: Check app and UI
        run: |
          cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting check failed.' }
          cargo test --locked --manifest-path app/src-tauri/Cargo.toml -- --skip windows_core_lifecycle --skip windows_tun_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }
          cargo clippy --locked --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Rust lint failed.' }
          node app/tests/ui.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'UI tests failed.' }
          node app/tests/ui-render.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Rendered UI checks failed.' }
      - name: Check modern Xray compatibility without system routing changes
        run: |
          ./app/tests/prepare-interop.ps1
          node app/tests/core-interop.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Xray interoperability failed.' }
      - name: Check automatic selection and failover without system routing changes
        run: |
          node app/tests/core-selection.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Automatic-group traffic and failover failed.' }
      - name: Check installed helper and automatic TUN routing
        run: |
          cargo build --locked --manifest-path app/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Helper test app build failed.' }
          $env:AKIMOV_SERVICE_TEST_EXE = Join-Path $PWD 'app/src-tauri/target/debug/akimov-vpn.exe'
          cargo test --locked --manifest-path app/src-tauri/Cargo.toml windows_service_smoke -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Installed helper lifecycle failed.' }
          cargo test --locked --manifest-path app/src-tauri/Cargo.toml windows_tun_auto_route_smoke -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Automatic TUN TCP/UDP/DNS routing failed.' }
      - name: Build Windows setup installer
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx --yes @tauri-apps/cli@2.12.4 build --ci --bundles nsis -- --locked
          } else {
            # Without the signing key this release cannot be offered as an in-app update; it still installs by hand.
            Write-Warning 'TAURI_SIGNING_PRIVATE_KEY is not set: building without update artifacts.'
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding ascii ../no-updater.json
            npx --yes @tauri-apps/cli@2.12.4 build --ci --bundles nsis --config ../no-updater.json -- --locked
          }
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
      - name: Check installer data cleanup hooks
        run: |
          ./app/tests/uninstall-hook.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer hook checks failed.' }
      - name: Package portable app, source and checksums
        run: |
          ./app/build.ps1 -SkipBuild
          $release = New-Item -ItemType Directory -Force release
          $setup = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($setup.Count -ne 1) { throw 'Expected exactly one installer.' }
          $setupName = "akimov-vpn-$env:APP_VERSION-windows-x64-setup.exe"
          Copy-Item -LiteralPath $setup[0].FullName -Destination "release/$setupName"
          # The update feed the app reads. Only a signed installer is ever offered as an update.
          $signature = "$($setup[0].FullName).sig"
          if (Test-Path -LiteralPath $signature) {
            @{
              version = $env:APP_VERSION
              notes = (Get-Content -Raw RELEASE_NOTES.md)
              pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
              platforms = @{ 'windows-x86_64' = @{
                signature = (Get-Content -Raw -LiteralPath $signature).Trim()
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:APP_VERSION/$setupName"
              } }
            } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 release/latest.json
          }
          Compress-Archive -Path "app/dist/akimov-vpn-desktop-$env:APP_VERSION/*" -DestinationPath "release/akimov-vpn-$env:APP_VERSION-windows-x64-portable.zip"
          Copy-Item -LiteralPath .tools/mihomo-v1.19.33.zip -Destination release/mihomo-v1.19.33-upstream-source.zip
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object { "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name } | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-${{ env.APP_VERSION }}
          path: release/*
          if-no-files-found: error
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: akimov vpn ${{ env.APP_VERSION }}
          body_path: RELEASE_NOTES.md
          files: release/*
          fail_on_unmatched_files: true
